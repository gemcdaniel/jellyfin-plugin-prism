version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/plugin/Jellyfin.Plugin.Prism"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/plugin/Jellyfin.Plugin.Prism.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
